[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/montaglue/pliron-inspect"
readme = "README.md"

[workspace.dependencies]
pliron-inspect-protocol = { version = "0.1.0", path = "crates/protocol" }
# The IR model of pliron-lsp's dialect engines (github.com/montaglue/pliron-lsp).
pliron-lsp-protocol = { git = "https://github.com/montaglue/pliron-lsp.git", rev = "519ad37f1c1f1a41ff155bab5d39a9b93d8bee43" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
