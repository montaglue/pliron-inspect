[package]
name = "pliron-inspect"
description = "Interactive inspector for pliron compiler traces: a web UI over pliron-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["pliron", "compiler", "ir", "debugger"]
categories = ["development-tools", "visualization"]

[[bin]]
name = "pliron-inspect"
path = "src/main.rs"

[dependencies]
pliron-inspect-protocol.workspace = true
pliron-lsp-protocol.workspace = true
flowblocks = "0.2"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["full"] }
open = "5"
dirs = "6"
similar = "2"
sha2 = "0.10"
