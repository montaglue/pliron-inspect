[package]
name = "pliron-inspect"
description = "Interactive pliron IR inspector: web UI over a swappable IR driver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["pliron", "compiler", "ir", "debugger"]
categories = ["development-tools", "visualization"]

[[bin]]
name = "pliron-inspect"
path = "src/main.rs"

[dependencies]
pliron-inspect-protocol.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["full"] }
open = "5"
dirs = "6"
